[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-extractor"
version = "2.0.0"
description = "Invoice OCR + parser + optional LLM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "easyocr>=1.7.1",
    "pytesseract>=0.3.10",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "Pillow>=10.0.0",
    "PyYAML>=6.0",
    "openpyxl>=3.1.0",
    "openai>=1.0.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
]

[project.scripts]
invoice-extract = "invoice_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

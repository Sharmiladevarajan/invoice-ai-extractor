<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Invoice Extractor</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; background: #f4f5f7; color: #1a1a1a; }
    h1 { font-size: 1.4rem; margin: 0 0 8px; }
    p { color: #555; margin: 0 0 20px; }
    .card { background: #fff; border-radius: 10px; padding: 20px; max-width: 1100px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin-bottom: 16px; }
    label { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; font-weight: 600; }
    select, button, input[type="number"] { padding: 8px 12px; font-size: 0.95rem; border-radius: 6px; border: 1px solid #ccc; }
    input[type="number"] { width: 5rem; }
    button { background: #2563eb; color: #fff; border: none; cursor: pointer; font-weight: 600; }
    button:disabled { opacity: 0.6; cursor: wait; }
    .links { display: none; gap: 12px; margin: 12px 0; }
    .links a { color: #2563eb; font-weight: 600; }
    #status { font-size: 0.9rem; color: #333; min-height: 1.2em; }
    .table-wrap { overflow: auto; margin-top: 16px; max-height: 420px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th, td { border: 1px solid #e5e7eb; padding: 6px 8px; text-align: left; }
    th { background: #f9fafb; position: sticky; top: 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Invoice Extractor</h1>
    <p>Images from <code>data/images</code> (batch1-0331 … 0331+). LLM runs only if fields are missing.</p>

    <div class="row">
      <label>OCR engine
        <select id="ocr">
          <option value="easyocr">EasyOCR — accurate, slower</option>
          <option value="tesseract">Tesseract — faster</option>
        </select>
      </label>
      <label>Records to process
        <input type="number" id="limit" min="1" max="50" value="5" title="1–50, or check All below" />
      </label>
      <label style="flex-direction:row;align-items:center;gap:6px;font-weight:600;padding-bottom:8px">
        <input type="checkbox" id="all" /> All in range (up to 50)
      </label>
      <label>
        <span>LLM if needed</span>
        <select id="llm">
          <option value="true">Yes (when OPENAI_API_KEY set)</option>
          <option value="false">No</option>
        </select>
      </label>
      <button id="run">Process invoices</button>
    </div>

    <div id="status"></div>
    <div class="links" id="links">
      <a href="/api/download/csv">Download CSV</a>
      <a href="/api/download/excel">Download Excel</a>
    </div>

    <div class="table-wrap">
      <table id="tbl">
        <thead><tr id="head"></tr></thead>
        <tbody id="body"></tbody>
      </table>
    </div>
  </div>

  <script>
    const status = document.getElementById('status');
    const runBtn = document.getElementById('run');
    const links = document.getElementById('links');
    const limitInput = document.getElementById('limit');
    const allCheck = document.getElementById('all');

    allCheck.onchange = () => {
      limitInput.disabled = allCheck.checked;
    };

    fetch('/api/config').then(r => r.json()).then(cfg => {
      limitInput.max = cfg.limit_max;
      limitInput.value = cfg.limit_default;
    }).catch(() => {});

    runBtn.onclick = async () => {
      runBtn.disabled = true;
      const limit = allCheck.checked ? 50 : parseInt(limitInput.value, 10);
      status.textContent = `Processing ${allCheck.checked ? 'all' : limit} invoice(s)… (may take several minutes)`;
      links.style.display = 'none';
      try {
        const res = await fetch('/api/process', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            ocr_engine: document.getElementById('ocr').value,
            use_llm: document.getElementById('llm').value === 'true',
            limit: limit,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || res.statusText);
        let msg = `Done: ${data.count} invoice(s) via ${data.ocr_engine}.`;
        if (data.failed) msg += ` (${data.failed} failed)`;
        if (data.warning) msg += ' ' + data.warning;
        status.textContent = msg;
        links.style.display = 'flex';
        renderTable(data.rows);
      } catch (e) {
        status.textContent = 'Error: ' + e.message;
      } finally {
        runBtn.disabled = false;
      }
    };

    function renderTable(rows) {
      if (!rows.length) return;
      const cols = Object.keys(rows[0]);
      document.getElementById('head').innerHTML = cols.map(c => `<th>${c}</th>`).join('');
      document.getElementById('body').innerHTML = rows.map(r =>
        `<tr>${cols.map(c => `<td>${r[c] ?? ''}</td>`).join('')}</tr>`
      ).join('');
    }
  </script>
</body>
</html>
